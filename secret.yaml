# Secret for SQL Server credentials (shared by primary and secondary)
# MSSQL_SA_PASSWORD must meet SQL Server complexity requirements:
#   - At least 8 characters, with uppercase, lowercase, digit, and special char
apiVersion: v1
kind: Secret
metadata:
  name: sqlserver-secret
  namespace: sql
type: Opaque
stringData:
  MSSQL_SA_PASSWORD: "K8sAdmin1234!"
